name: Video Crop + Waveform + Upload to Google Drive

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL'
        required: true
      drive_folder_id:
        description: 'Google Drive folder ID to upload video'
        required: true
      video_name:
        description: 'Name for the uploaded video'
        required: true

jobs:
  process-video:
    runs-on: ubuntu-latest

    outputs:
      drive_url: ${{ steps.upload.outputs.drive_url }}
      video_file_id: ${{ steps.upload.outputs.video_file_id }}

    steps:

      # ==========================================
      # Install basic dependencies
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          echo "Updating apt..."

          for i in 1 2 3 4 5; do
            echo "APT update attempt $i/5"

            if sudo apt update; then
              echo "APT update succeeded."
              break
            fi

            if [ "$i" -eq 5 ]; then
              echo "ERROR: apt update failed after 5 attempts."
              exit 1
            fi

            echo "Waiting 5 seconds before retry..."
            sleep 5
          done

          sudo apt install -y wget python3-pip file

          pip3 install --user requests


      # ==========================================
      # Download / Install FFmpeg
      # ==========================================

      - name: Install / Download FFmpeg
        run: |
          set -e

          FFMPEG_DIR="$HOME/ffmpeg-bin"

          rm -rf "$FFMPEG_DIR"
          mkdir -p "$FFMPEG_DIR"

          SUCCESS=0


          # ==========================================
          # SOURCE 1
          # John Van Sickle
          # ==========================================

          echo ""
          echo "=========================================="
          echo "FFmpeg source 1/3"
          echo "John Van Sickle"
          echo "=========================================="

          URL1="https://johnvansickle.com/ffmpeg/releases/ffmpeg-7.0.2-amd64-static.tar.xz"

          rm -f ffmpeg.tar.xz

          for i in 1 2 3; do

            echo ""
            echo "Attempt $i/3"

            rm -f ffmpeg.tar.xz

            if wget \
              --timeout=30 \
              --tries=2 \
              -O ffmpeg.tar.xz \
              "$URL1"; then

              echo "wget completed."

              if file ffmpeg.tar.xz | grep -qi "XZ compressed"; then

                echo "Valid XZ archive detected."

                rm -rf ffmpeg-7.0.2-amd64-static

                if tar -xf ffmpeg.tar.xz; then

                  if [ -x "ffmpeg-7.0.2-amd64-static/ffmpeg" ]; then

                    cp \
                      ffmpeg-7.0.2-amd64-static/ffmpeg \
                      "$FFMPEG_DIR/ffmpeg"

                    if [ -f "ffmpeg-7.0.2-amd64-static/ffprobe" ]; then
                      cp \
                        ffmpeg-7.0.2-amd64-static/ffprobe \
                        "$FFMPEG_DIR/ffprobe"
                    fi

                    chmod +x "$FFMPEG_DIR/ffmpeg"

                    if [ -f "$FFMPEG_DIR/ffprobe" ]; then
                      chmod +x "$FFMPEG_DIR/ffprobe"
                    fi

                    SUCCESS=1

                    echo "FFmpeg installed from source 1."

                    break

                  fi

                fi

              else

                echo "Downloaded file is NOT a valid XZ archive."
                file ffmpeg.tar.xz

              fi

            else

              echo "wget failed."

            fi

            if [ "$i" -lt 3 ]; then
              echo "Waiting 5 seconds..."
              sleep 5
            fi

          done


          # ==========================================
          # SOURCE 2
          # BtbN GitHub
          # ==========================================

          if [ "$SUCCESS" -ne 1 ]; then

            echo ""
            echo "=========================================="
            echo "FFmpeg source 2/3"
            echo "BtbN GitHub"
            echo "=========================================="

            URL2="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"

            rm -f ffmpeg.tar.xz

            for i in 1 2 3; do

              echo ""
              echo "Attempt $i/3"

              rm -f ffmpeg.tar.xz

              if wget \
                --timeout=60 \
                --tries=2 \
                -O ffmpeg.tar.xz \
                "$URL2"; then

                echo "wget completed."

                if file ffmpeg.tar.xz | grep -qi "XZ compressed"; then

                  echo "Valid XZ archive detected."

                  rm -rf ffmpeg-master-latest-linux64-gpl

                  if tar -xf ffmpeg.tar.xz; then

                    FFMPEG_PATH=$(find . \
                      -type f \
                      -name ffmpeg \
                      -perm -111 \
                      | head -n 1)

                    FFPROBE_PATH=$(find . \
                      -type f \
                      -name ffprobe \
                      -perm -111 \
                      | head -n 1)

                    if [ -n "$FFMPEG_PATH" ]; then

                      cp \
                        "$FFMPEG_PATH" \
                        "$FFMPEG_DIR/ffmpeg"

                      chmod +x "$FFMPEG_DIR/ffmpeg"

                      if [ -n "$FFPROBE_PATH" ]; then
                        cp \
                          "$FFPROBE_PATH" \
                          "$FFMPEG_DIR/ffprobe"

                        chmod +x "$FFMPEG_DIR/ffprobe"
                      fi

                      SUCCESS=1

                      echo "FFmpeg installed from source 2."

                      break

                    fi

                  fi

                else

                  echo "Downloaded file is NOT a valid XZ archive."
                  file ffmpeg.tar.xz

                fi

              else

                echo "wget failed."

              fi

              if [ "$i" -lt 3 ]; then
                echo "Waiting 5 seconds..."
                sleep 5
              fi

            done

          fi


          # ==========================================
          # SOURCE 3
          # Ubuntu APT
          # ==========================================

          if [ "$SUCCESS" -ne 1 ]; then

            echo ""
            echo "=========================================="
            echo "FFmpeg source 3/3"
            echo "Ubuntu APT"
            echo "=========================================="

            for i in 1 2 3; do

              echo ""
              echo "APT FFmpeg install attempt $i/3"

              if sudo apt install -y ffmpeg; then

                if command -v ffmpeg >/dev/null 2>&1; then

                  cp \
                    "$(command -v ffmpeg)" \
                    "$FFMPEG_DIR/ffmpeg"

                  chmod +x "$FFMPEG_DIR/ffmpeg"

                  if command -v ffprobe >/dev/null 2>&1; then

                    cp \
                      "$(command -v ffprobe)" \
                      "$FFMPEG_DIR/ffprobe"

                    chmod +x "$FFMPEG_DIR/ffprobe"

                  fi

                  SUCCESS=1

                  echo "FFmpeg installed from Ubuntu APT."

                  break

                fi

              else

                echo "APT FFmpeg installation failed."

              fi

              if [ "$i" -lt 3 ]; then
                echo "Waiting 5 seconds..."
                sleep 5
              fi

            done

          fi


          # ==========================================
          # Final FFmpeg check
          # ==========================================

          if [ "$SUCCESS" -ne 1 ]; then

            echo ""
            echo "=========================================="
            echo "ERROR"
            echo "=========================================="
            echo "Unable to install FFmpeg."
            exit 1

          fi


          echo "$FFMPEG_DIR" >> "$GITHUB_PATH"


          echo ""
          echo "=========================================="
          echo "FFmpeg successfully installed"
          echo "=========================================="

          "$FFMPEG_DIR/ffmpeg" -version


      # ==========================================
      # Download video
      # ==========================================

      - name: Download video
        run: |
          set -e

          VIDEO_URL="${{ github.event.inputs.video_url }}"

          SUCCESS=0

          for i in 1 2 3 4 5; do

            echo ""
            echo "=========================================="
            echo "Video download attempt $i/5"
            echo "=========================================="

            rm -f input.mp4

            if wget \
              --timeout=60 \
              --tries=3 \
              --continue \
              -O input.mp4 \
              "$VIDEO_URL"; then

              if [ -s input.mp4 ]; then

                echo "Video downloaded successfully."

                SUCCESS=1

                break

              else

                echo "Downloaded file is empty."

              fi

            else

              echo "Video download failed."

            fi

            if [ "$i" -lt 5 ]; then
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi

          done


          if [ "$SUCCESS" -ne 1 ]; then

            echo ""
            echo "ERROR: Video download failed after 5 attempts."

            exit 1

          fi


          echo ""
          echo "Downloaded video:"
          ls -lh input.mp4


      # ==========================================
      # Crop top & bottom then scale
      # ==========================================

      - name: Crop top & bottom then scale
        run: |
          set -e

          SUCCESS=0

          for i in 1 2 3 4 5; do

            echo ""
            echo "=========================================="
            echo "Crop attempt $i/5"
            echo "=========================================="

            rm -f output_cropped.mp4

            if ffmpeg \
              -y \
              -i input.mp4 \
              -vf "crop=in_w:545,scale=1280:720,setsar=1" \
              output_cropped.mp4; then

              if [ -s output_cropped.mp4 ]; then

                echo "Crop completed successfully."

                SUCCESS=1

                break

              else

                echo "Output file is empty."

              fi

            else

              echo "FFmpeg crop failed."

            fi

            if [ "$i" -lt 5 ]; then
              echo "Waiting 5 seconds before retry..."
              sleep 5
            fi

          done


          if [ "$SUCCESS" -ne 1 ]; then

            echo ""
            echo "ERROR: Crop failed after 5 attempts."

            exit 1

          fi


          ls -lh output_cropped.mp4


      # ==========================================
      # Add waveform starting at 13 seconds
      # ==========================================

      - name: Add waveform starting at 13s
        run: |
          set -e

          SUCCESS=0

          for i in 1 2 3 4 5; do

            echo ""
            echo "=========================================="
            echo "Waveform attempt $i/5"
            echo "=========================================="

            rm -f output_final.mp4

            if ffmpeg \
              -y \
              -i output_cropped.mp4 \
              -filter_complex "\
              [0:a]compand,showwaves=s=629x8:colors=white@1:draw=full:mode=p2p,format=yuva420p[wave]; \
              [0:v][wave]overlay=x=541:y=616:format=auto:enable='gte(t,13)',format=yuv420p[outv]" \
              -map "[outv]" \
              -map 0:a \
              -c:v libx264 \
              -c:a copy \
              output_final.mp4; then

              if [ -s output_final.mp4 ]; then

                echo "Waveform processing completed successfully."

                SUCCESS=1

                break

              else

                echo "Output file is empty."

              fi

            else

              echo "FFmpeg waveform processing failed."

            fi

            if [ "$i" -lt 5 ]; then
              echo "Waiting 5 seconds before retry..."
              sleep 5
            fi

          done


          if [ "$SUCCESS" -ne 1 ]; then

            echo ""
            echo "ERROR: Waveform processing failed after 5 attempts."

            exit 1

          fi


          ls -lh output_final.mp4


      # ==========================================
      # Upload to Google Drive
      # ==========================================

      - name: Upload to Google Drive
        id: upload

        env:
          CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

          DRIVE_FOLDER_ID: ${{ github.event.inputs.drive_folder_id }}
          VIDEO_NAME: ${{ github.event.inputs.video_name }}

          N8N_WEBHOOK_URL: https://n8n-2tgd.onrender.com/webhook/35833a97-aa94-4207-90cc-479bc5c31a71

        run: |

          python3 <<'EOF'

          import os
          import requests
          import json
          import sys
          import time


          # ==========================================
          # Environment variables
          # ==========================================

          client_id = os.environ["CLIENT_ID"]
          client_secret = os.environ["CLIENT_SECRET"]
          refresh_token = os.environ["REFRESH_TOKEN"]

          folder_id = os.environ["DRIVE_FOLDER_ID"]
          video_name = os.environ["VIDEO_NAME"]

          webhook_url = os.environ["N8N_WEBHOOK_URL"]


          # ==========================================
          # Retry HTTP request
          # ==========================================

          def request_with_retry(
              method,
              url,
              max_attempts=5,
              **kwargs
          ):

              last_response = None

              for attempt in range(1, max_attempts + 1):

                  print("")
                  print("==========================================")
                  print(
                      f"{method} attempt "
                      f"{attempt}/{max_attempts}"
                  )
                  print("==========================================")

                  try:

                      response = requests.request(
                          method,
                          url,
                          **kwargs
                      )

                      last_response = response

                      print(
                          "HTTP status:",
                          response.status_code
                      )


                      if 200 <= response.status_code < 300:

                          return response


                      print(
                          "Request failed:",
                          response.text[:1000]
                      )


                  except Exception as e:

                      print(
                          "Request exception:",
                          str(e)
                      )


                  if attempt < max_attempts:

                      wait_time = attempt * 5

                      print(
                          f"Waiting {wait_time} seconds..."
                      )

                      time.sleep(wait_time)


              return last_response


          # ==========================================
          # Get Google Access Token
          # ==========================================

          print("Getting Google access token...")


          token_resp = request_with_retry(

              "POST",

              "https://oauth2.googleapis.com/token",

              max_attempts=5,

              data={
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "refresh_token": refresh_token,
                  "grant_type": "refresh_token"
              },

              timeout=30

          )


          if (
              token_resp is None
              or token_resp.status_code != 200
          ):

              print("Token error:")

              if token_resp is not None:
                  print(token_resp.text)

              sys.exit(1)


          access_token = token_resp.json()["access_token"]


          headers = {
              "Authorization": f"Bearer {access_token}"
          }


          print(
              "Google access token obtained successfully."
          )


          # ==========================================
          # Search for existing file
          # ==========================================

          print("Searching for existing file...")


          search_url = (

              "https://www.googleapis.com/drive/v3/files"

              f"?q=name='{video_name}' "

              f"and '{folder_id}' in parents "

              "&fields=files(id,name)"

          )


          resp = request_with_retry(

              "GET",

              search_url,

              max_attempts=5,

              headers=headers,

              timeout=30

          )


          if (
              resp is not None
              and resp.status_code == 200
          ):

              existing_files = resp.json().get(
                  "files",
                  []
              )


              print(
                  f"Found {len(existing_files)} existing file(s)."
              )


              # ==========================================
              # Delete existing files
              # ==========================================

              for existing_file in existing_files:

                  existing_id = existing_file["id"]
                  existing_name = existing_file["name"]


                  delete_url = (

                      "https://www.googleapis.com/drive/v3/files/"

                      f"{existing_id}"

                  )


                  del_resp = request_with_retry(

                      "DELETE",

                      delete_url,

                      max_attempts=5,

                      headers=headers,

                      timeout=30

                  )


                  if (
                      del_resp is not None
                      and del_resp.status_code in [200, 204]
                  ):

                      print(
                          f"Deleted existing file: {existing_name}"
                      )

                  else:

                      print(
                          f"Failed to delete {existing_name}"
                      )

          else:

              print(
                  "Search failed."
              )

              if resp is not None:

                  print(
                      resp.status_code,
                      resp.text
                  )


          # ==========================================
          # Prepare upload metadata
          # ==========================================

          metadata = {

              "name": video_name,

              "parents": [folder_id]

          }


          # ==========================================
          # Upload video
          # ==========================================

          print(
              "Uploading video to Google Drive..."
          )


          upload_success = False
          upload_resp = None


          for attempt in range(1, 6):

              print("")
              print("==========================================")
              print(
                  f"Google Drive upload attempt "
                  f"{attempt}/5"
              )
              print("==========================================")


              try:

                  with open(
                      "output_final.mp4",
                      "rb"
                  ) as video_file:

                      files = {

                          "metadata": (

                              "metadata",

                              json.dumps(metadata),

                              "application/json"

                          ),

                          "file": (

                              "output_final.mp4",

                              video_file,

                              "video/mp4"

                          )

                      }


                      upload_resp = requests.post(

                          "https://www.googleapis.com/upload/drive/v3/files"
                          "?uploadType=multipart",

                          headers=headers,

                          files=files,

                          timeout=600

                      )


                  print(
                      "Google Drive HTTP status:",
                      upload_resp.status_code
                  )


                  if (
                      200
                      <= upload_resp.status_code
                      < 300
                  ):

                      upload_success = True

                      break


                  print(
                      "Upload failed:",
                      upload_resp.text[:1000]
                  )


              except Exception as e:

                  print(
                      "Upload exception:",
                      str(e)
                  )


              if attempt < 5:

                  wait_time = attempt * 10

                  print(
                      f"Waiting {wait_time} seconds "
                      "before retry..."
                  )

                  time.sleep(wait_time)


          if not upload_success:

              print("")
              print(
                  "ERROR: Google Drive upload failed "
                  "after 5 attempts."
              )

              sys.exit(1)


          # ==========================================
          # Parse upload response
          # ==========================================

          try:

              result = upload_resp.json()

          except Exception:

              print(
                  "Invalid Google Drive response:"
              )

              print(upload_resp.text)

              sys.exit(1)


          print(
              "Drive response:",
              result
          )


          # ==========================================
          # Get file ID
          # ==========================================

          file_id = result.get("id")


          if not file_id:

              print(
                  "Upload failed - no file ID returned."
              )

              sys.exit(1)


          drive_url = (

              f"https://drive.google.com/file/d/"

              f"{file_id}/view"

          )


          print("")
          print("==========================================")
          print("UPLOAD SUCCESS")
          print("==========================================")
          print(
              "Video File ID:",
              file_id
          )
          print(
              "Drive URL:",
              drive_url
          )
          print("==========================================")


          # ==========================================
          # Send videoFileId to n8n Webhook
          # ==========================================

          print("")
          print(
              "Sending videoFileId to n8n..."
          )


          webhook_payload = {

              "videoFileId": file_id

          }


          webhook_headers = {

              "Content-Type": "application/json"

          }


          webhook_success = False
          webhook_resp = None


          for attempt in range(1, 6):

              print("")
              print("==========================================")
              print(
                  f"n8n webhook attempt "
                  f"{attempt}/5"
              )
              print("==========================================")


              try:

                  webhook_resp = requests.post(

                      webhook_url,

                      json=webhook_payload,

                      headers=webhook_headers,

                      timeout=30

                  )


                  print(
                      "n8n Webhook HTTP status:",
                      webhook_resp.status_code
                  )


                  print(
                      "n8n Webhook response:",
                      webhook_resp.text[:1000]
                  )


                  if (
                      200
                      <= webhook_resp.status_code
                      < 300
                  ):

                      webhook_success = True

                      break


              except Exception as e:

                  print(
                      "Webhook exception:",
                      str(e)
                  )


              if attempt < 5:

                  wait_time = attempt * 5

                  print(
                      f"Waiting {wait_time} seconds..."
                  )

                  time.sleep(wait_time)


          # ==========================================
          # Check n8n response
          # ==========================================

          if not webhook_success:

              print("")
              print(
                  "ERROR: Failed to send videoFileId "
                  "to n8n after 5 attempts."
              )

              sys.exit(1)


          print("")
          print(
              "videoFileId successfully sent to n8n."
          )


          # ==========================================
          # GitHub Actions Outputs
          # ==========================================

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as output_file:

              output_file.write(
                  f"drive_url={drive_url}\n"
              )

              output_file.write(
                  f"video_file_id={file_id}\n"
              )


          print("")
          print(
              "GitHub outputs created successfully."
          )

          EOF
