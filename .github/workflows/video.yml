      - name: Upload to Google Drive
        id: upload
        env:
          CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ github.event.inputs.drive_folder_id }}
          VIDEO_NAME: ${{ github.event.inputs.video_name }}
          N8N_WEBHOOK_URL: https://n8n-2tgd.onrender.com/webhook/35833a97-aa94-4207-90cc-479bc5c31a71
        run: |
          python3 <<'EOF'
          import os
          import requests
          import json
          import sys

          client_id = os.environ["CLIENT_ID"]
          client_secret = os.environ["CLIENT_SECRET"]
          refresh_token = os.environ["REFRESH_TOKEN"]
          folder_id = os.environ["DRIVE_FOLDER_ID"]
          video_name = os.environ["VIDEO_NAME"]
          webhook_url = os.environ["N8N_WEBHOOK_URL"]

          # =========================
          # Get Google Access Token
          # =========================

          token_resp = requests.post(
              "https://oauth2.googleapis.com/token",
              data={
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "refresh_token": refresh_token,
                  "grant_type": "refresh_token"
              }
          )

          if token_resp.status_code != 200:
              print("Token error:", token_resp.text)
              sys.exit(1)

          access_token = token_resp.json()["access_token"]

          headers = {
              "Authorization": f"Bearer {access_token}"
          }

          # =========================
          # Delete existing file
          # =========================

          search_url = (
              f"https://www.googleapis.com/drive/v3/files"
              f"?q=name='{video_name}' and '{folder_id}' in parents"
              f"&fields=files(id,name)"
          )

          resp = requests.get(search_url, headers=headers)

          if resp.status_code == 200:
              existing_files = resp.json().get("files", [])

              for f in existing_files:
                  delete_url = (
                      f"https://www.googleapis.com/drive/v3/files/{f['id']}"
                  )

                  del_resp = requests.delete(
                      delete_url,
                      headers=headers
                  )

                  if del_resp.status_code in [204, 200]:
                      print(f"Deleted existing file: {f['name']}")
                  else:
                      print(
                          f"Failed to delete {f['name']}: "
                          f"{del_resp.text}"
                      )
          else:
              print("Search failed:", resp.text)

          # =========================
          # Upload video
          # =========================

          metadata = {
              "name": video_name,
              "parents": [folder_id],
          }

          with open("output_final.mp4", "rb") as video_file:

              files = {
                  "metadata": (
                      "metadata",
                      json.dumps(metadata),
                      "application/json"
                  ),
                  "file": video_file,
              }

              upload = requests.post(
                  "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
                  headers=headers,
                  files=files,
              )

          result = upload.json()

          print("Drive response:", result)

          # =========================
          # Get File ID
          # =========================

          file_id = result.get("id")

          if not file_id:
              print("Upload failed")
              sys.exit(1)

          drive_url = f"https://drive.google.com/file/d/{file_id}/view"

          print("Video File ID:", file_id)
          print("Drive URL:", drive_url)

          # =========================
          # Send videoFileId to n8n
          # =========================

          webhook_payload = {
              "videoFileId": file_id
          }

          webhook_resp = requests.post(
              webhook_url,
              json=webhook_payload,
              timeout=30
          )

          print("n8n Webhook status:", webhook_resp.status_code)
          print("n8n Webhook response:", webhook_resp.text)

          if webhook_resp.status_code < 200 or webhook_resp.status_code >= 300:
              print("Failed to send videoFileId to n8n")
              sys.exit(1)

          print("videoFileId successfully sent to n8n")

          # =========================
          # GitHub Actions Output
          # =========================

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"drive_url={drive_url}\n")
              f.write(f"video_file_id={file_id}\n")
