name: Video Montage + Waveform + Upload to Google Drive

on:
  workflow_dispatch:
    inputs:
      intro_url:
        description: "Intro video URL"
        required: true
        type: string

      image_url:
        description: "Image URL"
        required: true
        type: string

      audio_url:
        description: "Audio URL"
        required: true
        type: string

      drive_folder_id:
        description: "Google Drive folder ID"
        required: true
        type: string

      video_name:
        description: "Name of uploaded video"
        required: true
        type: string

      webhook_url:
        description: "n8n webhook URL"
        required: true
        type: string

      waveform_position:
        description: "Waveform position 1-8"
        required: true
        type: string

jobs:
  process-video:
    runs-on: ubuntu-latest

    outputs:
      drive_url: ${{ steps.upload.outputs.drive_url }}
      video_file_id: ${{ steps.upload.outputs.video_file_id }}

    steps:

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Installing dependencies"
          echo "=========================================="

          for i in 1 2 3 4 5; do
            echo "APT update attempt $i/5"

            if sudo apt update; then
              echo "APT update succeeded."
              break
            fi

            if [ "$i" -eq 5 ]; then
              echo "ERROR: apt update failed after 5 attempts."
              exit 1
            fi

            sleep 5
          done

          sudo apt install -y \
            wget \
            python3 \
            python3-pip \
            file \
            curl

          python3 -m pip install --user requests --break-system-packages || \
          python3 -m pip install --user requests


      # ==========================================================
      # INSTALL FFMPEG
      # ==========================================================

      - name: Install FFmpeg
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Installing FFmpeg"
          echo "=========================================="

          FFMPEG_DIR="$HOME/ffmpeg-bin"

          rm -rf "$FFMPEG_DIR"
          mkdir -p "$FFMPEG_DIR"

          SUCCESS=0

          # ======================================================
          # SOURCE 1 - JOHN VAN SICKLE
          # ======================================================

          echo ""
          echo "=========================================="
          echo "FFmpeg source 1/3"
          echo "John Van Sickle"
          echo "=========================================="

          URL1="https://johnvansickle.com/ffmpeg/releases/ffmpeg-7.0.2-amd64-static.tar.xz"

          rm -f ffmpeg.tar.xz

          for i in 1 2 3; do

            echo "Attempt $i/3"

            rm -f ffmpeg.tar.xz

            if wget \
              --timeout=60 \
              --tries=3 \
              -O ffmpeg.tar.xz \
              "$URL1"; then

              if file ffmpeg.tar.xz | grep -qi "XZ compressed"; then

                rm -rf ffmpeg-7.0.2-amd64-static

                if tar -xf ffmpeg.tar.xz; then

                  if [ -x "ffmpeg-7.0.2-amd64-static/ffmpeg" ]; then

                    cp \
                      ffmpeg-7.0.2-amd64-static/ffmpeg \
                      "$FFMPEG_DIR/ffmpeg"

                    if [ -f "ffmpeg-7.0.2-amd64-static/ffprobe" ]; then
                      cp \
                        ffmpeg-7.0.2-amd64-static/ffprobe \
                        "$FFMPEG_DIR/ffprobe"
                    fi

                    chmod +x "$FFMPEG_DIR/ffmpeg"

                    if [ -f "$FFMPEG_DIR/ffprobe" ]; then
                      chmod +x "$FFMPEG_DIR/ffprobe"
                    fi

                    SUCCESS=1

                    echo "FFmpeg installed from source 1."
                    break
                  fi
                fi
              else
                echo "Downloaded file is not a valid XZ archive."
                file ffmpeg.tar.xz
              fi

            else
              echo "wget failed."
            fi

            if [ "$i" -lt 3 ]; then
              sleep 5
            fi

          done


          # ======================================================
          # SOURCE 2 - BTBN GITHUB
          # ======================================================

          if [ "$SUCCESS" -ne 1 ]; then

            echo ""
            echo "=========================================="
            echo "FFmpeg source 2/3"
            echo "BtbN GitHub"
            echo "=========================================="

            URL2="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"

            rm -f ffmpeg.tar.xz

            for i in 1 2 3; do

              echo "Attempt $i/3"

              rm -f ffmpeg.tar.xz

              if wget \
                --timeout=60 \
                --tries=3 \
                -O ffmpeg.tar.xz \
                "$URL2"; then

                if file ffmpeg.tar.xz | grep -qi "XZ compressed"; then

                  rm -rf ffmpeg-master-latest-linux64-gpl

                  if tar -xf ffmpeg.tar.xz; then

                    FFMPEG_PATH=$(find . \
                      -type f \
                      -name ffmpeg \
                      -perm -111 \
                      | head -n 1)

                    FFPROBE_PATH=$(find . \
                      -type f \
                      -name ffprobe \
                      -perm -111 \
                      | head -n 1)

                    if [ -n "$FFMPEG_PATH" ]; then

                      cp \
                        "$FFMPEG_PATH" \
                        "$FFMPEG_DIR/ffmpeg"

                      chmod +x "$FFMPEG_DIR/ffmpeg"

                      if [ -n "$FFPROBE_PATH" ]; then
                        cp \
                          "$FFPROBE_PATH" \
                          "$FFMPEG_DIR/ffprobe"

                        chmod +x "$FFMPEG_DIR/ffprobe"
                      fi

                      SUCCESS=1

                      echo "FFmpeg installed from source 2."
                      break
                    fi
                  fi

                else
                  echo "Downloaded file is not a valid XZ archive."
                  file ffmpeg.tar.xz
                fi

              else
                echo "wget failed."
              fi

              if [ "$i" -lt 3 ]; then
                sleep 5
              fi

            done
          fi


          # ======================================================
          # SOURCE 3 - UBUNTU APT
          # ======================================================

          if [ "$SUCCESS" -ne 1 ]; then

            echo ""
            echo "=========================================="
            echo "FFmpeg source 3/3"
            echo "Ubuntu APT"
            echo "=========================================="

            for i in 1 2 3; do

              echo "APT FFmpeg install attempt $i/3"

              if sudo apt install -y ffmpeg; then

                if command -v ffmpeg >/dev/null 2>&1; then

                  cp \
                    "$(command -v ffmpeg)" \
                    "$FFMPEG_DIR/ffmpeg"

                  chmod +x "$FFMPEG_DIR/ffmpeg"

                  if command -v ffprobe >/dev/null 2>&1; then

                    cp \
                      "$(command -v ffprobe)" \
                      "$FFMPEG_DIR/ffprobe"

                    chmod +x "$FFMPEG_DIR/ffprobe"
                  fi

                  SUCCESS=1

                  echo "FFmpeg installed from Ubuntu APT."
                  break
                fi

              else
                echo "APT FFmpeg installation failed."
              fi

              if [ "$i" -lt 3 ]; then
                sleep 5
              fi

            done
          fi


          # ======================================================
          # FINAL FFMPEG CHECK
          # ======================================================

          if [ "$SUCCESS" -ne 1 ]; then
            echo ""
            echo "=========================================="
            echo "ERROR"
            echo "=========================================="
            echo "Unable to install FFmpeg."
            exit 1
          fi

          if [ ! -x "$FFMPEG_DIR/ffmpeg" ]; then
            echo "ERROR: ffmpeg binary not found."
            exit 1
          fi

          if [ ! -x "$FFMPEG_DIR/ffprobe" ]; then
            echo "ERROR: ffprobe binary not found."
            exit 1
          fi

          echo "$FFMPEG_DIR" >> "$GITHUB_PATH"

          echo ""
          echo "=========================================="
          echo "FFmpeg successfully installed"
          echo "=========================================="

          "$FFMPEG_DIR/ffmpeg" -version | head -n 3

          echo ""
          echo "Checking FFprobe..."

          "$FFMPEG_DIR/ffprobe" -version | head -n 3


      # ==========================================================
      # DOWNLOAD INTRO
      # ==========================================================

      - name: Download intro
        shell: bash
        run: |
          set -e

          INTRO_URL="${{ inputs.intro_url }}"

          echo "=========================================="
          echo "Downloading intro"
          echo "=========================================="

          rm -f intro.mp4

          for i in 1 2 3 4 5; do

            echo "Download attempt $i/5"

            if wget \
              --timeout=120 \
              --tries=3 \
              --continue \
              -O intro.mp4 \
              "$INTRO_URL"; then

              if [ -s intro.mp4 ]; then
                echo "Intro downloaded successfully."
                break
              fi
            fi

            rm -f intro.mp4

            if [ "$i" -eq 5 ]; then
              echo "ERROR: Could not download intro."
              exit 1
            fi

            sleep 5
          done

          ls -lh intro.mp4


      # ==========================================================
      # DOWNLOAD IMAGE
      # ==========================================================

      - name: Download image
        shell: bash
        run: |
          set -e

          IMAGE_URL="${{ inputs.image_url }}"

          echo "=========================================="
          echo "Downloading image"
          echo "=========================================="

          rm -f image.png

          for i in 1 2 3 4 5; do

            echo "Download attempt $i/5"

            if wget \
              --timeout=120 \
              --tries=3 \
              --continue \
              -O image.png \
              "$IMAGE_URL"; then

              if [ -s image.png ]; then
                echo "Image downloaded successfully."
                break
              fi
            fi

            rm -f image.png

            if [ "$i" -eq 5 ]; then
              echo "ERROR: Could not download image."
              exit 1
            fi

            sleep 5
          done

          echo ""
          echo "Image information:"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width,height \
            -of default=noprint_wrappers=1 \
            image.png

          ls -lh image.png


      # ==========================================================
      # DOWNLOAD AUDIO
      # ==========================================================

      - name: Download audio
        shell: bash
        run: |
          set -e

          AUDIO_URL="${{ inputs.audio_url }}"

          echo "=========================================="
          echo "Downloading audio"
          echo "=========================================="

          rm -f audio.ogg

          for i in 1 2 3 4 5; do

            echo "Download attempt $i/5"

            if wget \
              --timeout=120 \
              --tries=3 \
              --continue \
              -O audio.ogg \
              "$AUDIO_URL"; then

              if [ -s audio.ogg ]; then
                echo "Audio downloaded successfully."
                break
              fi
            fi

            rm -f audio.ogg

            if [ "$i" -eq 5 ]; then
              echo "ERROR: Could not download audio."
              exit 1
            fi

            sleep 5
          done

          echo ""
          echo "Audio information:"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            audio.ogg

          ls -lh audio.ogg


      # ==========================================================
      # MEDIA INFORMATION
      # ==========================================================

      - name: Analyze media
        shell: bash
        run: |
          set -e

          INTRO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            intro.mp4)

          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            audio.ogg)

          IMAGE_WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of default=noprint_wrappers=1:nokey=1 \
            image.png)

          IMAGE_HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of default=noprint_wrappers=1:nokey=1 \
            image.png)

          echo ""
          echo "=========================================="
          echo "MEDIA INFORMATION"
          echo "=========================================="

          echo "Intro duration: $INTRO_DURATION"
          echo "Audio duration: $AUDIO_DURATION"
          echo "Image width: $IMAGE_WIDTH"
          echo "Image height: $IMAGE_HEIGHT"

          if [ -z "$INTRO_DURATION" ]; then
            echo "ERROR: Could not detect intro duration."
            exit 1
          fi

          if [ -z "$AUDIO_DURATION" ]; then
            echo "ERROR: Could not detect audio duration."
            exit 1
          fi

          if [ "$IMAGE_WIDTH" != "1920" ] || [ "$IMAGE_HEIGHT" != "1080" ]; then
            echo ""
            echo "WARNING:"
            echo "Input image is not 1920x1080."
            echo "It will be fitted into a 1920x1080 canvas."
          fi

          echo "=========================================="


      # ==========================================================
      # CREATE MONTAGE
      # ==========================================================

      - name: Create montage
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Creating final montage"
          echo "=========================================="

          SUCCESS=0

          for i in 1 2 3 4 5; do

            echo ""
            echo "Montage attempt $i/5"

            # ============================================================
            # STEP 1: Prepare intro
            # ============================================================

            echo "--- Step 1: Preparing intro ---"

            rm -f intro_prepared.mp4

            if ! ffmpeg -y \
              -i intro.mp4 \
              -t 9 \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p" \
              -an \
              -c:v libx264 \
              -preset ultrafast \
              -crf 18 \
              -r 30 \
              -fps_mode cfr \
              -video_track_timescale 15360 \
              intro_prepared.mp4; then
              echo "Step 1 failed."
              sleep 5
              continue
            fi

            if [ ! -s intro_prepared.mp4 ]; then
              echo "Step 1 produced empty file."
              sleep 5
              continue
            fi

            # ============================================================
            # STEP 2: Prepare image
            # ============================================================

            echo "--- Step 2: Preparing image ---"

            rm -f image_prepared.mp4

            if ! ffmpeg -y \
              -loop 1 \
              -framerate 30 \
              -t 5 \
              -i image.png \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p" \
              -an \
              -c:v libx264 \
              -preset ultrafast \
              -crf 18 \
              -r 30 \
              -fps_mode cfr \
              -video_track_timescale 15360 \
              image_prepared.mp4; then
              echo "Step 2 failed."
              sleep 5
              continue
            fi

            if [ ! -s image_prepared.mp4 ]; then
              echo "Step 2 produced empty file."
              sleep 5
              continue
            fi

            # ============================================================
            # STEP 3: xfade
            # ============================================================

            echo "--- Step 3: Applying xfade ---"

            rm -f montage_video.mp4

            if ! ffmpeg -y \
              -i intro_prepared.mp4 \
              -i image_prepared.mp4 \
              -filter_complex "[0:v][1:v]xfade=transition=fade:duration=1:offset=8[v]" \
              -map "[v]" \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 18 \
              -pix_fmt yuv420p \
              -r 30 \
              -fps_mode cfr \
              montage_video.mp4; then
              echo "Step 3 failed."
              sleep 5
              continue
            fi

            if [ ! -s montage_video.mp4 ]; then
              echo "Step 3 produced empty file."
              sleep 5
              continue
            fi

            # ============================================================
            # STEP 4: Add audio
            # ============================================================

            echo "--- Step 4: Adding audio ---"

            rm -f montage.mp4

            if ! ffmpeg -y \
              -i montage_video.mp4 \
              -i audio.ogg \
              -map 0:v \
              -map 1:a \
              -c:v copy \
              -c:a aac \
              -b:a 192k \
              -shortest \
              -movflags +faststart \
              montage.mp4; then
              echo "Step 4 failed."
              sleep 5
              continue
            fi

            if [ -s montage.mp4 ]; then

              echo ""
              echo "Montage created successfully."

              SUCCESS=1
              break
            fi

            echo "Montage failed."
            echo "Waiting 5 seconds..."
            sleep 5

          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo ""
            echo "ERROR: Montage failed after 5 attempts."
            exit 1
          fi

          echo ""
          echo "Montage information:"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=index,codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            montage.mp4

          ls -lh montage.mp4


      # ==========================================================
      # ADD WAVEFORM
      # ==========================================================

      - name: Add waveform
        shell: bash
        run: |
          set -e

          POSITION="${{ inputs.waveform_position }}"

          echo "=========================================="
          echo "Adding waveform"
          echo "Position: $POSITION"
          echo "=========================================="

          case "$POSITION" in

            1)
              X=1065
              Y=533
              W=776
              H=13
              ;;

            2)
              X=332
              Y=112
              W=1256
              H=13
              ;;

            3)
              X=179
              Y=654
              W=1563
              H=13
              ;;

            4)
              X=90
              Y=534
              W=614
              H=13
              ;;

            5)
              X=309
              Y=346
              W=1302
              H=13
              ;;

            6)
              X=176
              Y=732
              W=1569
              H=13
              ;;

            7)
              X=277
              Y=230
              W=1132
              H=13
              ;;

            8)
              X=444
              Y=850
              W=1353
              H=13
              ;;

            *)
              echo "ERROR: waveform_position must be 1-8."
              exit 1
              ;;
          esac

          echo "X=$X"
          echo "Y=$Y"
          echo "W=$W"
          echo "H=$H"

          PAD_X=18
          PAD_Y=16

          BOX_X=$((X - PAD_X))
          BOX_Y=$((Y - PAD_Y))
          BOX_W=$((W + PAD_X * 2))
          BOX_H=$((H + PAD_Y * 2))

          # ==========================================================
          # Detect montage duration
          # ==========================================================

          MONTAGE_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            montage.mp4)

          echo "Montage duration: $MONTAGE_DURATION"

          if [ -z "$MONTAGE_DURATION" ]; then
            echo "ERROR: Could not detect montage duration."
            exit 1
          fi

          # ==========================================================
          # IMPORTANT
          #
          # Waveform should exist for the entire montage.
          # We do NOT start the waveform audio at second 13.
          #
          # The overlay itself starts at second 13.
          # ==========================================================

          PROCESS_DURATION="$MONTAGE_DURATION"

          rm -f output_final.mp4

          echo ""
          echo "=========================================="
          echo "Rendering waveform overlay"
          echo "=========================================="

          ffmpeg \
            -y \
            -i montage.mp4 \
            -i audio.ogg \
            -filter_complex "
              [1:a]
              atrim=duration=${PROCESS_DURATION},
              asetpts=PTS-STARTPTS,
              showwaves=
                s=${W}x${H}:
                mode=cline:
                rate=30:
                scale=sqrt:
                colors=white,
                format=rgba
              [wave];

              [0:v]
              drawbox=
                x=${BOX_X}:
                y=${BOX_Y}:
                w=${BOX_W}:
                h=${BOX_H}:
                color=black@0.55:
                t=fill:
                enable='gte(t,13)'
              [base];

              [base][wave]
              overlay=
                x=${X}:
                y=${Y}:
                format=auto:
                eof_action=pass:
                repeatlast=0:
                enable='gte(t,13)'
              [v]
            " \
            -map "[v]" \
            -map 0:a? \
            -c:v libx264 \
            -preset medium \
            -crf 18 \
            -pix_fmt yuv420p \
            -c:a copy \
            -t "$PROCESS_DURATION" \
            -movflags +faststart \
            output_final.mp4

          if [ ! -s output_final.mp4 ]; then
            echo "ERROR: output_final.mp4 was not created."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "WAVEFORM RENDER COMPLETE"
          echo "=========================================="

          ls -lh output_final.mp4

          echo ""
          echo "Final video information:"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=index,codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output_final.mp4


      # ==========================================================
      # GOOGLE DRIVE UPLOAD
      # ==========================================================

      - name: Upload to Google Drive
        id: upload
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ inputs.drive_folder_id }}
          VIDEO_NAME: ${{ inputs.video_name }}
        run: |
          set -e

          echo "=========================================="
          echo "Google Drive upload"
          echo "=========================================="

          python3 <<'PY'
          import os
          import sys
          import json
          import requests

          CLIENT_ID = os.environ["GOOGLE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["GOOGLE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["GOOGLE_REFRESH_TOKEN"]

          FOLDER_ID = os.environ["DRIVE_FOLDER_ID"]
          VIDEO_NAME = os.environ["VIDEO_NAME"]

          FILE_PATH = "output_final.mp4"

          print("Getting Google OAuth access token...")

          token_response = requests.post(
              "https://oauth2.googleapis.com/token",
              data={
                  "client_id": CLIENT_ID,
                  "client_secret": CLIENT_SECRET,
                  "refresh_token": REFRESH_TOKEN,
                  "grant_type": "refresh_token",
              },
              timeout=60,
          )

          if token_response.status_code != 200:
              print("ERROR: Could not get Google access token.")
              print(token_response.text)
              sys.exit(1)

          access_token = token_response.json()["access_token"]

          headers = {
              "Authorization": f"Bearer {access_token}"
          }

          # ======================================================
          # SEARCH EXISTING FILE
          # ======================================================

          print("Searching for existing file...")

          query = (
              f"name = '{VIDEO_NAME.replace(chr(39), chr(92) + chr(39))}' "
              f"and '{FOLDER_ID}' in parents "
              f"and trashed = false"
          )

          params = {
              "q": query,
              "spaces": "drive",
              "fields": "files(id,name)",
              "pageSize": 100,
          }

          search_response = requests.get(
              "https://www.googleapis.com/drive/v3/files",
              headers=headers,
              params=params,
              timeout=60,
          )

          if search_response.status_code != 200:
              print("ERROR: Google Drive search failed.")
              print(search_response.text)
              sys.exit(1)

          existing_files = search_response.json().get("files", [])

          # ======================================================
          # DELETE OLD FILES
          # ======================================================

          for old_file in existing_files:
              old_id = old_file["id"]

              print(
                  f"Deleting existing file: "
                  f"{old_file.get('name')} ({old_id})"
              )

              delete_response = requests.delete(
                  f"https://www.googleapis.com/drive/v3/files/{old_id}",
                  headers=headers,
                  timeout=60,
              )

              if delete_response.status_code not in (200, 204):
                  print("WARNING: Could not delete old file.")
                  print(delete_response.text)

          # ======================================================
          # CREATE MULTIPART UPLOAD
          # ======================================================

          print("Uploading new video...")

          metadata = {
              "name": VIDEO_NAME,
              "parents": [FOLDER_ID],
              "mimeType": "video/mp4",
          }

          with open(FILE_PATH, "rb") as video_file:

              files = {
                  "metadata": (
                      None,
                      json.dumps(metadata),
                      "application/json; charset=UTF-8",
                  ),
                  "file": (
                      VIDEO_NAME,
                      video_file,
                      "video/mp4",
                  ),
              }

              upload_response = requests.post(
                  "https://www.googleapis.com/upload/drive/v3/files",
                  headers=headers,
                  params={
                      "uploadType": "multipart",
                      "fields": "id,name,webViewLink",
                  },
                  files=files,
                  timeout=1800,
              )

          if upload_response.status_code not in (200, 201):
              print("ERROR: Google Drive upload failed.")
              print(upload_response.text)
              sys.exit(1)

          uploaded = upload_response.json()

          file_id = uploaded["id"]

          drive_url = (
              f"https://drive.google.com/file/d/{file_id}/view"
          )

          print("")
          print("==========================================")
          print("UPLOAD SUCCESSFUL")
          print("==========================================")
          print(f"File ID: {file_id}")
          print(f"Drive URL: {drive_url}")

          # ======================================================
          # GITHUB ACTIONS OUTPUTS
          # ======================================================

          github_output = os.environ.get("GITHUB_OUTPUT")

          if github_output:
              with open(github_output, "a") as output:
                  output.write(
                      f"drive_url={drive_url}\n"
                  )
                  output.write(
                      f"video_file_id={file_id}\n"
                  )

          # Save result for next step

          with open("upload_result.json", "w") as result:
              json.dump(
                  {
                      "videoFileId": file_id,
                      "drive_url": drive_url,
                      "video_name": VIDEO_NAME,
                  },
                  result,
                  indent=2,
              )
          PY


      # ==========================================================
      # SEND RESULT TO N8N
      # ==========================================================

      - name: Notify n8n
        shell: bash
        env:
          WEBHOOK_URL: ${{ inputs.webhook_url }}
        run: |
          set -e

          echo "=========================================="
          echo "Sending result to n8n"
          echo "=========================================="

          if [ ! -f upload_result.json ]; then
            echo "ERROR: upload_result.json not found."
            exit 1
          fi

          cat upload_result.json

          python3 <<'PY'
          import os
          import json
          import sys
          import requests

          webhook_url = os.environ["WEBHOOK_URL"]

          with open("upload_result.json", "r") as f:
              payload = json.load(f)

          print("Sending callback to n8n...")

          response = requests.post(
              webhook_url,
              json=payload,
              headers={
                  "Content-Type": "application/json"
              },
              timeout=120,
          )

          print(f"n8n HTTP status: {response.status_code}")
          print(response.text)

          if response.status_code < 200 or response.status_code >= 300:
              print("ERROR: n8n webhook returned an error.")
              sys.exit(1)

          print("n8n callback sent successfully.")
          PY


      # ==========================================================
      # FINAL SUMMARY
      # ==========================================================

      - name: Final summary
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "VIDEO PROCESSING COMPLETED"
          echo "=========================================="

          echo "Video name:"
          echo "${{ inputs.video_name }}"

          echo ""
          echo "Drive URL:"
          echo "${{ steps.upload.outputs.drive_url }}"

          echo ""
          echo "Video File ID:"
          echo "${{ steps.upload.outputs.video_file_id }}"

          echo ""
          echo "Waveform position:"
          echo "${{ inputs.waveform_position }}"

          echo ""
          echo "=========================================="
